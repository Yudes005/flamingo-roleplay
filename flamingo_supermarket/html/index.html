<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flamingo Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app" class="hidden">
    <div class="market" id="market">

      <!-- ============ ZAGLAVLJE ============ -->
      <header class="market-header">
        <div class="brand">
          <div class="brand-logo" data-ic="basket"></div>
          <div class="brand-text">
            <span class="brand-small" id="welcomeTitle">Dobrodošli u</span>
            <h1 id="shopLabel">Flamingo Market</h1>
          </div>
        </div>

        <label class="search">
          <span data-ic="search"></span>
          <input id="search" placeholder="Pretraži artikle" autocomplete="off">
        </label>

        <button class="close-btn" id="closeBtn" title="Zatvori (ESC)"><span data-ic="x"></span></button>
      </header>

      <div class="market-body">

        <!-- ============ ARTIKLI ============ -->
        <section class="products-panel">
          <div class="products-head">
            <div>
              <h2 id="productsTitle">Artikli</h2>
              <span id="productsCount" class="muted"></span>
            </div>
            <div class="chips" id="chips"></div>
          </div>
          <div id="productList" class="product-grid"></div>
          <div id="productsEmpty" class="products-empty hidden">
            <span data-ic="search"></span>
            <b>Nema rezultata</b>
            <span>Probaj drugi naziv artikla.</span>
          </div>
        </section>

        <!-- ============ KORPA ============ -->
        <aside class="cart-panel">
          <div class="cart-head">
            <h2 id="cartLabel">Korpa</h2>
            <span class="cart-count hidden" id="cartCount">0</span>
            <button class="link-btn hidden" id="clearCart">Isprazni</button>
          </div>

          <div id="cartEmpty" class="cart-empty">
            <div class="cart-empty-ic" data-ic="cart"></div>
            <b id="emptyCartLabel">Vaša korpa je prazna</b>
            <span>Dodaj artikle klikom na +</span>
          </div>

          <ul id="cartItems" class="cart-items hidden"></ul>

          <div class="cart-footer">
            <div class="cart-sum">
              <div class="sum-row"><span>Artikala</span><span id="itemsCount">0</span></div>
              <div class="sum-row total"><span id="totalLabel">Ukupno</span><span id="totalAmount">0$</span></div>
            </div>

            <div class="cart-actions">
              <button id="payCardBtn" class="pay-btn card" disabled>
                <span data-ic="card"></span>
                <span class="pay-t"><b id="payCard">Plati karticom</b><small>Sa bankovnog računa</small></span>
              </button>
              <button id="payCashBtn" class="pay-btn cash" disabled>
                <span data-ic="cash"></span>
                <span class="pay-t"><b id="payCash">Plati kešom</b><small>Gotovinom</small></span>
              </button>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
