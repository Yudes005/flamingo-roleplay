<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacije</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SVG ikonice (koriste se preko <use href="#i-...">) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-all" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
            <symbol id="i-favorites" viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6-5.38-2.83-5.38 2.83 1.03-6L3.3 9.6l6-.9z"/></symbol>
            <symbol id="i-general" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.8"/><path d="M4.5 20.5c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></symbol>
            <symbol id="i-dances" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2.3V15.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/></symbol>
            <symbol id="i-expressions" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.2 14.2c.9 1.4 2.2 2.1 3.8 2.1s2.9-.7 3.8-2.1"/><path d="M9 9.5h.01M15 9.5h.01"/></symbol>
            <symbol id="i-walks" viewBox="0 0 24 24"><circle cx="13.5" cy="4.5" r="2"/><path d="M9.5 21l2.2-6.2 2.8 2.7V21"/><path d="M7 11.5l2.8-3.3 4 .8 2.2 3.2 2.5.8"/><path d="M11.7 14.8l.9-5.6"/></symbol>
            <symbol id="i-placedemotes" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
            <symbol id="i-syncedemotes" viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.6"/><path d="M2.8 19.5c0-3.3 2.6-5.6 5.7-5.6s5.7 2.3 5.7 5.6"/><path d="M15.5 14.2c2.9-.2 5.7 1.7 5.7 4.8"/></symbol>
            <symbol id="i-propemotes" viewBox="0 0 24 24"><path d="M12 2.8l8.2 4.6v9.2L12 21.2l-8.2-4.6V7.4z"/><path d="M3.8 7.4L12 12l8.2-4.6M12 12v9.2"/></symbol>
            <symbol id="i-erpemotes" viewBox="0 0 24 24"><path d="M12 20.3S3.5 15.4 3.5 9.2A4.7 4.7 0 0 1 12 6.6a4.7 4.7 0 0 1 8.5 2.6c0 6.2-8.5 11.1-8.5 11.1z"/></symbol>
            <symbol id="i-animalemotes" viewBox="0 0 24 24"><ellipse cx="6" cy="10.5" rx="1.9" ry="2.4"/><ellipse cx="9.8" cy="6.3" rx="1.9" ry="2.4"/><ellipse cx="14.2" cy="6.3" rx="1.9" ry="2.4"/><ellipse cx="18" cy="10.5" rx="1.9" ry="2.4"/><path d="M12 12.2c2.6 0 5.2 3.1 5.2 5.6 0 1.8-1.6 2.6-3.2 2.1-.8-.3-1.3-.5-2-.5s-1.2.2-2 .5c-1.6.5-3.2-.3-3.2-2.1 0-2.5 2.6-5.6 5.2-5.6z"/></symbol>
            <symbol id="i-default" viewBox="0 0 24 24"><path d="M12 3l1.9 5.2L19 10l-5.1 1.8L12 17l-1.9-5.2L5 10l5.1-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></symbol>
            <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
            <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
            <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.4"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></symbol>
            <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5L4.5 13.5H12L11 21.5l8.5-11H12z"/></symbol>
        </defs>
    </svg>

    <div id="app" class="app" aria-hidden="true">
        <main class="panel" id="panel">
            <header class="head">
                <h1 class="head__title" id="menuTitle">Animacije</h1>
                <div class="search">
                    <svg class="search__icon"><use href="#i-search"/></svg>
                    <input id="searchInput" type="text" placeholder="Pretraga (naziv ili komanda)" autocomplete="off" spellcheck="false">
                    <button class="search__clear" id="searchClear" title="Obriši"><svg><use href="#i-close"/></svg></button>
                </div>
                <button class="icon-btn" id="closeBtn" title="Zatvori (ESC)"><svg><use href="#i-close"/></svg></button>
            </header>

            <nav class="tabs" id="categoryRail"></nav>

            <div class="toolbar">
                <div class="toolbar__info">
                    <span id="categoryTitle">Sve</span>
                    <span class="toolbar__count" id="resultCount">0 animacija</span>
                </div>
                <div class="seg" role="group" aria-label="Izgled">
                    <button class="seg__btn is-active" data-layout="grid" title="Mreža"><svg><use href="#i-grid"/></svg></button>
                    <button class="seg__btn" data-layout="list" title="Lista"><svg><use href="#i-list"/></svg></button>
                </div>
            </div>

            <div class="scroller" id="scroller">
                <div class="grid" id="grid"></div>
                <div class="sentinel" id="sentinel"></div>
                <div class="empty" id="emptyState" hidden>
                    <p class="empty__title" id="emptyTitle">Nema rezultata</p>
                    <p class="empty__text" id="emptyText">Probaj drugi naziv ili komandu.</p>
                    <button class="btn" id="emptyAction" hidden>Pretraži sve kategorije</button>
                </div>
            </div>

            <footer class="quick">
                <div class="quick__info">
                    <span class="quick__title">Brzi slotovi</span>
                    <span class="quick__hint"><span id="quickKey">LSHIFT</span> + 1–7 · desni klik na animaciju za dodelu</span>
                </div>
                <div class="quick__slots" id="quickSlots"></div>
            </footer>

            <div class="toast" id="toast"></div>
        </main>
    </div>

    <!-- Kontekst meni (desni klik na animaciju) -->
    <div class="ctx" id="ctx" hidden>
        <div class="ctx__head">
            <span class="ctx__label" id="ctxLabel"></span>
            <span class="ctx__cmd" id="ctxCmd"></span>
        </div>
        <button class="ctx__item" data-ctx="play"><svg><use href="#i-play"/></svg>Pokreni animaciju</button>
        <button class="ctx__item" data-ctx="fav"><svg><use href="#i-favorites"/></svg><span id="ctxFavText">Dodaj u omiljene</span></button>
        <button class="ctx__item" data-ctx="copy"><svg><use href="#i-copy"/></svg>Kopiraj komandu</button>
        <div class="ctx__sep"></div>
        <span class="ctx__sub">Dodeli brzom slotu</span>
        <div class="ctx__slots" id="ctxSlots"></div>
    </div>

    <!-- Kontrole za postavljanje animacije -->
    <div class="pos" id="animPosInfoDiv">
        <div class="pos__item"><kbd>E</kbd><span>Potvrdi</span></div>
        <div class="pos__item"><kbd>ESC</kbd><span>Otkaži</span></div>
        <div class="pos__item"><kbd>TOČKIĆ</kbd><span>Rotacija</span></div>
        <div class="pos__item"><kbd>Z</kbd><span>Visina</span></div>
        <div class="pos__item"><kbd>CTRL</kbd><span>Drži za preciznost</span></div>
    </div>

    <script src="url.js"></script>
    <script src="index.js"></script>
</body>
</html>
