<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <title>Flamingo Bet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="glow g1"></div>
        <div class="glow g2"></div>

        <!-- Lijeva traka -->
        <nav class="rail">
            <div class="rail-logo" title="Flamingo Bet"><b>F</b></div>
            <button class="rail-btn active" data-tab="offer" title="Ponuda">
                <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
                <span>Ponuda</span>
            </button>
            <button class="rail-btn" data-tab="tickets" title="Moji tiketi">
                <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5zM9 5v14" /></svg>
                <span>Tiketi</span>
                <i id="railBadge" class="rail-badge hidden">0</i>
            </button>
            <div class="rail-spacer"></div>
            <button id="closeBtn" class="rail-btn close" title="Zatvori (ESC)">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                <span>Izlaz</span>
            </button>
        </nav>

        <!-- Sredina -->
        <section class="main">
            <header class="topbar">
                <div id="sports" class="sport-switch"></div>
                <label class="search">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                    <input id="search" type="text" placeholder="Pretraži timove..." autocomplete="off">
                </label>
                <div class="top-right">
                    <div class="balance" title="Keš kod tebe">
                        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 10h18"/></svg>
                        <span id="balance">$0</span>
                    </div>
                    <div id="clock" class="clock"></div>
                </div>
            </header>

            <div id="offerView" class="scroll">
                <div id="hero" class="hero"></div>

                <div id="featuredWrap" class="section">
                    <div class="section-head">
                        <h3><span class="dot"></span>Top utakmice</h3>
                        <div class="arrows">
                            <button data-scroll="-1">‹</button>
                            <button data-scroll="1">›</button>
                        </div>
                    </div>
                    <div id="featured" class="featured"></div>
                </div>

                <div class="section sticky-filters">
                    <div id="leagues" class="chips"></div>
                    <div id="days" class="chips days"></div>
                </div>

                <div id="events" class="events"></div>
            </div>

            <div id="ticketsView" class="scroll hidden">
                <div class="tickets-top">
                    <div>
                        <h2>Moji tiketi</h2>
                        <p>Tiketi koje imaš u inventaru. Dobitne isplaćuješ ovdje.</p>
                    </div>
                    <button id="payAllBtn" class="btn-primary hidden">Isplati sve dobitne</button>
                </div>
                <div id="tickets" class="tickets"></div>
            </div>
        </section>

        <!-- Tiket -->
        <aside class="slip">
            <div class="slip-head">
                <div>
                    <div class="slip-title">Tvoj tiket</div>
                    <div class="slip-sub"><span id="slipCount">0</span> <span id="slipCountLbl">parova</span></div>
                </div>
                <button id="slipClear" class="slip-clear" title="Obriši sve">
                    <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
                </button>
            </div>
            <div id="slipList" class="slip-list"></div>
            <div class="perf"></div>
            <div class="slip-foot">
                <div class="sum-row"><span>Ukupna kvota</span><b id="slipOdds">1.00</b></div>
                <div class="stake">
                    <span id="stakeCur">$</span>
                    <input id="stake" type="number" min="1" step="1" value="100">
                </div>
                <div id="quick" class="quick"></div>
                <div class="win-box">
                    <span>Mogući dobitak</span>
                    <b id="slipWin">$0</b>
                </div>
                <div id="slipMsg" class="msg"></div>
                <button id="placeBtn" class="btn-primary big">
                    <span>Uplati tiket</span>
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </aside>
    </div>

    <div id="ticketModal" class="modal hidden">
        <div class="modal-card">
            <div id="ticketModalBody"></div>
            <div class="modal-note">Dobitni tiket isplaćuješ na šalteru kladionice.</div>
            <button id="ticketModalClose" class="btn-primary">Zatvori</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
