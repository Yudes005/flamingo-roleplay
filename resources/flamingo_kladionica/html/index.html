<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <title>Flamingo Bet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">F</span>
                <span class="brand-name">Flamingo<span>bet</span></span>
            </div>
            <nav class="nav">
                <button data-tab="offer" class="active">Ponuda</button>
                <button data-tab="tickets">Moji tiketi <i id="navBadge" class="nav-badge hidden">0</i></button>
            </nav>
            <div class="top-right">
                <div class="balance">
                    <span>Keš</span>
                    <b id="balance">$0</b>
                </div>
                <span id="clock" class="clock"></span>
                <button id="closeBtn" class="close-btn" title="Zatvori (ESC)">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <div class="side-label">Sport</div>
                <div id="sports" class="side-list"></div>
                <div class="side-label">Lige</div>
                <div id="leagues" class="side-list"></div>
            </aside>

            <main class="content">
                <section id="offerView" class="scroll">
                    <div class="page-head">
                        <div>
                            <h1 id="pageTitle">Fudbal</h1>
                            <p id="pageSub"></p>
                        </div>
                        <label class="search">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                            <input id="search" type="text" placeholder="Pretraga tima" autocomplete="off">
                        </label>
                    </div>

                    <div id="featuredWrap" class="featured-wrap">
                        <div class="block-title">Istaknute utakmice</div>
                        <div id="featured" class="featured"></div>
                    </div>

                    <div id="days" class="daybar"></div>
                    <div id="events" class="events"></div>
                </section>

                <section id="ticketsView" class="scroll hidden">
                    <div class="page-head">
                        <div>
                            <h1>Moji tiketi</h1>
                            <p>Tiketi koje nosiš u inventaru. Dobitne tikete isplaćuješ ovdje.</p>
                        </div>
                        <button id="payAllBtn" class="btn btn-accent hidden">Isplati sve dobitne</button>
                    </div>
                    <div id="tickets" class="tickets"></div>
                </section>
            </main>

            <aside class="slip">
                <div class="slip-head">
                    <div class="slip-title">Tiket <span id="slipCount" class="count">0</span></div>
                    <button id="slipClear" class="link-btn">Obriši</button>
                </div>
                <div id="slipList" class="slip-list"></div>
                <div class="slip-foot">
                    <div class="line"><span>Ukupna kvota</span><b id="slipOdds">1.00</b></div>
                    <label class="field-label" for="stake">Uplata</label>
                    <div class="stake">
                        <span id="stakeCur">$</span>
                        <input id="stake" type="number" min="1" step="1" value="100">
                    </div>
                    <div id="quick" class="quick"></div>
                    <div class="line total"><span>Mogući dobitak</span><b id="slipWin">$0</b></div>
                    <div id="slipMsg" class="msg"></div>
                    <button id="placeBtn" class="btn btn-accent btn-block">Uplati tiket</button>
                </div>
            </aside>
        </div>
    </div>

    <div id="ticketModal" class="modal hidden">
        <div class="modal-inner">
            <div id="ticketModalBody"></div>
            <button id="ticketModalClose" class="btn btn-plain btn-block">Zatvori</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
