<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <title>Flamingo Bet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <header class="topbar">
            <div class="brand">
                <span class="logo">F</span>
                <span>Flamingo <b>Bet</b></span>
            </div>
            <nav class="tabs">
                <button data-tab="offer" class="active">Ponuda</button>
                <button data-tab="tickets">Moji tiketi</button>
            </nav>
            <div class="top-right">
                <span id="clock" class="clock"></span>
                <button id="closeBtn" class="icon-btn" title="Zatvori (ESC)">✕</button>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <div id="sports" class="sports"></div>
                <div class="side-title">Lige</div>
                <div id="leagues" class="leagues"></div>
            </aside>

            <main class="content">
                <section id="offerView">
                    <div class="toolbar">
                        <div id="days" class="days"></div>
                        <input id="search" class="search" type="text" placeholder="Pretraga tima..." autocomplete="off">
                    </div>
                    <div id="events" class="events"></div>
                </section>

                <section id="ticketsView" class="hidden">
                    <div class="tickets-head">
                        <h2>Tiketi u inventaru</h2>
                        <button id="payAllBtn" class="primary small hidden">Isplati sve dobitne</button>
                    </div>
                    <div id="tickets" class="tickets"></div>
                </section>
            </main>

            <aside class="slip">
                <div class="slip-head">
                    <span>Tiket <span id="slipCount" class="badge">0</span></span>
                    <button id="slipClear" class="link">Obriši sve</button>
                </div>
                <div id="slipList" class="slip-list"></div>
                <div class="slip-foot">
                    <div class="row"><span>Ukupna kvota</span><b id="slipOdds">1.00</b></div>
                    <label class="lbl" for="stake">Uplata</label>
                    <div class="stake">
                        <span id="stakeCur" class="cur">$</span>
                        <input id="stake" type="number" min="1" step="1" value="100">
                    </div>
                    <div id="quick" class="quick"></div>
                    <div class="row win"><span>Mogući dobitak</span><b id="slipWin">$0</b></div>
                    <div id="slipMsg" class="msg"></div>
                    <button id="placeBtn" class="primary big">Uplati tiket</button>
                </div>
            </aside>
        </div>
    </div>

    <div id="ticketModal" class="modal hidden">
        <div class="modal-card">
            <div id="ticketModalBody"></div>
            <div class="modal-note">Isplata dobitnih tiketa je na šalteru kladionice.</div>
            <button id="ticketModalClose" class="primary">Zatvori</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
